<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RepuestoFijo — La solución integral para repuestos de autos en Lima, Perú. Buscamos en todos los proveedores, consolidamos tu pedido y lo entregamos en tu taller el mismo día.">
    <link rel="canonical" href="https://repuestofijo.com/" />
    <title>RepuestoFijo</title>
    <link rel="icon" href="favicon_color.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000000;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        .logo-container {
            text-align: center;
            max-width: 920px;
            padding: 40px;
        }
        
        .logo {
            width: 100%;
            max-width: 820px;
            height: auto;
            filter: drop-shadow(0 20px 40px rgba(227, 6, 19, 0.3));
        }
        
        .tagline {
            margin-top: 40px;
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            letter-spacing: 8px;
            color: #ffffff;
            opacity: 0.85;
        }
        
        .bottom-line {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            color: #555;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Logo principal exacto como lo enviaste -->
        <img src="logo_color.png" alt="RepuestoFijo" class="logo">        
    </div>

    <div class="bottom-line">
        REPUESTO FIJO © 2026
    </div>

</body>
</html>
